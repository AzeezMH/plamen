name: tests

# Cross-OS CI companion to scripts/test_cross_os_hygiene.py: that test is a
# STATIC gate (no code actually executes on another OS), this workflow is
# the DYNAMIC complement — it runs the real scripts/ pytest suite on
# Linux, Windows, and macOS so behavioral cross-OS regressions (not just
# the syntactic anti-patterns the static gate catches) surface in CI
# instead of being caught manually after the fact.

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Matches the python-version used elsewhere in this repo's CI
      # (.github/workflows/install-smoke.yml) and the interpreter this
      # gate was authored/verified against.
      PYTHON_VERSION: "3.12"
      # Non-interactive guard: makes the driver's halt/purge prompts
      # (wait_halt_choice / wait_critical_halt_choice / wait_purge_choice)
      # auto-answer instead of blocking on a keypress. Without this the
      # integration lane (test_driver_smoke) hangs forever under CI's
      # (pseudo-)tty. `exit` = stop cleanly / keep artifacts (never auto-purge).
      PLAMEN_AUTO_HALT_CHOICE: "exit"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # Detect a requirements/pyproject file rather than assuming one
        # exists; skip cleanly if neither is present.
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          # Pinned test deps (pytest + pytest-xdist) via requirements-dev.txt,
          # which itself pulls in runtime requirements.txt. Fall back cleanly if
          # the dev file is absent (older checkout).
          if [ -f requirements-dev.txt ]; then
            echo "Installing pinned test deps from requirements-dev.txt"
            python -m pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            echo "Installing from requirements.txt (+ unpinned pytest fallback)"
            python -m pip install -r requirements.txt pytest pytest-xdist
          else
            echo "No requirements file found - installing pytest + pytest-xdist only"
            python -m pip install pytest pytest-xdist
          fi

      # Two lanes, together = the full suite (no test is skipped across them):
      #   fast lane        — everything EXCEPT the ~14 real-subprocess/timing
      #                      files, parallelized with xdist (`-n auto`).
      #   integration lane — ONLY those heavy files, run SERIALLY (they spawn
      #                      real processes / assert on real timing; xdist would
      #                      make them flaky). PLAMEN_AUTO_HALT_CHOICE=exit (job
      #                      env) keeps the driver-loop tests from hanging.
      # The lanes are separate steps so a failure names which class broke, and
      # so wall-clock is dominated by the parallel fast lane, not the serial one.
      - name: Fast lane (unit — parallel)
        shell: bash
        run: |
          cd scripts && python -m pytest -m "not integration" -n auto -q

      - name: Integration lane (real subprocess/timing — serial)
        shell: bash
        run: |
          cd scripts && python -m pytest -m "integration" -q
